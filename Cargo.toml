[package]
name = "simple-expressions"
version = "0.6.0"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "A small expression language with variables, function calls, simple types and common operators"
repository = "https://github.com/abatkin/expressions-rs"
readme = "README.md"
authors = ["Adam Batkin <adam@batkin.net>"]
keywords = ["expression"]
categories = ["template-engine", "compilers", "parser-implementations"]


[dependencies]
thiserror = "2"
pest = "2.9.5"
pest_derive = { version = "2.9.5", features = ["grammar-extras"] }

[features]
# Probe the native stack while parsing on targets where pest does not do so by
# default (it does only on x86_64/aarch64 -unknown-linux-gnu, -apple-darwin and
# -pc-windows-msvc; not on musl or windows-gnu, for example). Needs a toolchain
# supported by the `stacker` and `psm` crates.
stack-guard = ["pest/stack-guard"]
